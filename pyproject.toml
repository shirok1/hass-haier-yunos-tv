[project]
name = "hass-haier-yunos-tv"
version = "0.1.1"
description = "Native ADB control for Haier LE40AL88G31R1 in Home Assistant"
requires-python = ">=3.14.2"
dependencies = ["adb-shell[async]==0.4.4"]

[dependency-groups]
dev = [
  "homeassistant==2026.9.4",
  "pytest-homeassistant-custom-component==0.13.367",
  "pytest-cov>=6",
  "ruff>=0.13",
  "mypy>=1.18",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.14"
files = ["custom_components/haier_tv"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
follow_imports = "silent"
